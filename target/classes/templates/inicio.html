<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Inicio - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar('inicio')}"></nav>

<!-- Hero -->
<section class="bg-ff text-white py-5">
    <div class="container py-4 text-center">
        <span class="badge rounded-pill px-3 py-2 mb-3" style="background-color: var(--ff-rosa);">
            Nueva coleccion
        </span>
        <h1 class="fw-bold display-5">Viste tu estilo, encuentra tu FashFind</h1>
        <p class="lead text-white-50 mb-4">Ropa y accesorios seleccionados para cada ocasion.</p>
        <a th:href="${usuarioActual == null} ? @{/registro} : @{/cliente-dashboard}"
           class="btn btn-ff btn-lg px-4">
            <i class="bi bi-bag-heart me-1"></i>
            <span th:text="${usuarioActual == null} ? 'Crear cuenta y comprar' : 'Ir a mi cuenta'">Empezar</span>
        </a>
    </div>
</section>

<!-- Categorias -->
<div class="container py-5">
    <h4 class="fw-bold mb-4" style="color:#1a1a2e;">Compra por categoria</h4>
    <div class="row g-3">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100 text-center py-4">
                <i class="bi bi-person-dress fs-1 text-ff"></i>
                <p class="fw-semibold mt-2 mb-0">Mujer</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100 text-center py-4">
                <i class="bi bi-person-standing fs-1 text-ff"></i>
                <p class="fw-semibold mt-2 mb-0">Hombre</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100 text-center py-4">
                <i class="bi bi-bag fs-1 text-ff"></i>
                <p class="fw-semibold mt-2 mb-0">Accesorios</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100 text-center py-4">
                <i class="bi bi-stars fs-1 text-ff"></i>
                <p class="fw-semibold mt-2 mb-0">Novedades</p>
            </div>
        </div>
    </div>
</div>

<!-- Destacados -->
<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0" style="color:#1a1a2e;">Destacados</h4>
        <span class="text-muted small">El listado real se conecta a Producto e Inventario</span>
    </div>
    <div class="row g-3">
        <div class="col-6 col-md-3" th:each="i : ${#numbers.sequence(1, 4)}">
            <div class="card border-0 shadow-sm h-100">
                <div class="d-flex align-items-center justify-content-center bg-light" style="height: 180px;">
                    <i class="bi bi-image fs-1 text-muted"></i>
                </div>
                <div class="card-body">
                    <p class="fw-semibold mb-1">Producto de ejemplo</p>
                    <p class="text-ff fw-bold mb-0">$0</p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
