<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Vendedor - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex">

    <aside class="ff-sidebar d-flex flex-column">
        <div class="ff-sidebar-brand"><i class="bi bi-cash-coin me-2"></i>Vendedor</div>
        <nav class="nav flex-column flex-grow-1">
            <a class="nav-link active" th:href="@{/vendedor-dashboard}"><i class="bi bi-house-door"></i> Pagina Principal</a>
            <a class="nav-link" href="#"><i class="bi bi-cash-coin"></i> Gestion de Ventas</a>
            <a class="nav-link" href="#"><i class="bi bi-boxes"></i> Gestion de Inventario</a>
        </nav>
        <form th:action="@{/logout}" method="post" class="ff-sidebar-salir p-3">
            <button type="submit" class="nav-link btn btn-link text-start p-0 border-0">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesion
            </button>
        </form>
    </aside>

    <div class="flex-grow-1">
        <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3">
            <h5 class="mb-0 fw-bold">
                Bienvenido, <span th:text="${usuarioActual != null} ? ${usuarioActual.nombres} : 'Vendedor'">Vendedor</span>
            </h5>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-light btn-sm fw-semibold" style="color: var(--ff-rosa);">Salir</button>
            </form>
        </div>

        <div class="container-fluid p-4">
            <div class="input-group mb-4" style="max-width: 500px;">
                <input type="text" class="form-control" placeholder="Escribe tu busqueda">
                <button class="btn btn-ff" type="button">Buscar</button>
            </div>

            <div class="row g-3">
                <div class="col-6 col-lg-3">
                    <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                        <p class="fw-bold mb-1">Ventas Quincenales</p>
                        <p class="text-muted mb-0">Ej: 500000</p>
                    </div>
                </div>
            </div>

            <div class="alert alert-light border mt-4">
                <i class="bi bi-info-circle me-1"></i>
                El registro de ventas y el detalle por producto se construyen sobre
                las tablas Venta y Detalle_Venta en la siguiente etapa.
            </div>
        </div>
    </div>

</div>

</body>
</html>
