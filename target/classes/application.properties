spring.application.name=fashfind

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/Fash_Find?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuracion de JPA / Hibernate
# ddl-auto=none porque la base ya viene creada con el script SQL (incluye triggers
# que Hibernate no puede generar). Las tablas y datos se crean corriendo ese script
# directamente en MySQL antes de levantar la aplicacion.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
