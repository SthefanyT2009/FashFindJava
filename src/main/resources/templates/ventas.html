<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ventas - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='ventas')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3">
        <h5 class="mb-0 fw-bold">
            Gestion de Ventas - <span th:text="${usuarioActual != null} ? ${usuarioActual.nombres} : ''"></span>
        </h5>
        <div class="d-flex gap-2">
            <a th:href="@{/ventas/reporte}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-file-earmark-bar-graph me-1"></i>Reporte de Ventas
            </a>
            <a th:href="@{/ventas/nueva}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nueva Venta
            </a>
        </div>
    </div>

    <div class="container-fluid p-4">

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        
        <!-- Toast de éxito -->
        <div id="toastExito" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11; display:none;" th:if="${exito}">
            <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body d-flex align-items-center bg-success text-white rounded">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span id="textoToast" th:text="${exito}"></span>
                </div>
            </div>
        </div>

        <div class="ff-filtros">
            <div class="d-flex gap-2">
                <input type="text" id="filtroTexto" class="form-control" placeholder="Buscar en ventas (#, fecha, hora, vendedor, metodo, unidades, total, estado)...">
                <button type="button" id="btnToggleFiltros" class="btn btn-outline-secondary text-nowrap" aria-expanded="false" aria-controls="panelFiltros">
                    <i class="bi bi-funnel me-1"></i>Filtros
                </button>
            </div>
            <div id="panelFiltros" class="row g-2 align-items-end mt-3 d-none">
                <div class="col-6 col-md-2">
                    <select id="filtroMetodo" class="form-select">
                        <option value="">Metodo (todos)</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <select id="filtroEstado" class="form-select">
                        <option value="">Estado (todos)</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label for="filtroDesde" class="form-label small text-muted mb-1">Fecha desde</label>
                    <input type="date" id="filtroDesde" class="form-control" title="Desde">
                </div>
                <div class="col-6 col-md-3">
                    <label for="filtroHasta" class="form-label small text-muted mb-1">Fecha hasta</label>
                    <input type="date" id="filtroHasta" class="form-control" title="Hasta">
                </div>
                <div class="col-12 col-md-2">
                    <button type="button" id="btnLimpiarFiltros" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-circle me-1"></i>Limpiar
                    </button>
                </div>
            </div>
        </div>

        <div class="ff-card-table">
            <table class="table table-hover align-middle mb-0" id="tablaVentas">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Vendedor</th>
                    <th>Metodo de Pago</th>
                    <th class="text-center">Unidades</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(ventas)}">
                    <td colspan="9" class="text-center text-muted py-4">No hay ventas registradas.</td>
                </tr>
                <tr th:each="v : ${ventas}"
                    th:attr="data-search=${#strings.toLowerCase('#' + v.idVenta + ' ' + #temporals.format(v.fechaVenta, 'dd/MM/yyyy') + ' ' + #temporals.format(v.hora, 'HH:mm') + ' ' + v.usuario.nombres + ' ' + v.usuario.apellidos + ' ' + v.metodoPago + ' ' + v.totalUnidades + ' ' + v.costoTotal + ' ' + v.estado)},
                             data-metodo=${v.metodoPago},
                             data-estado=${v.estado},
                             data-fecha=${#temporals.format(v.fechaVenta, 'yyyy-MM-dd')}">
                    <td class="fw-semibold text-ff" th:text="'#' + ${v.idVenta}"></td>
                    <td th:text="${#temporals.format(v.fechaVenta, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(v.hora, 'HH:mm')}"></td>
                    <td th:text="${v.usuario.nombres} + ' ' + ${v.usuario.apellidos}"></td>
                    <td>
                        <span class="badge-stock badge-stock-normal" th:text="${v.metodoPago}"></span>
                    </td>
                    <td class="text-center" th:text="${v.totalUnidades}"></td>
                    <td class="fw-semibold" th:text="'$' + ${#numbers.formatInteger(v.costoTotal, 1, 'POINT')}"></td>
                    <td>
                        <span class="badge-stock" th:classappend="${v.estado == 'Activo'} ? 'badge-stock-normal' : 'badge-stock-bajo'"
                              th:text="${v.estado}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/ventas/' + ${v.idVenta}}" class="btn-ff-icon editar" title="Ver detalle">
                            <i class="bi bi-eye-fill"></i>
                        </a>
                        <a th:if="${v.estado == 'Activo'}" th:href="@{'/ventas/editar/' + ${v.idVenta}}" class="btn-ff-icon editar" title="Actualizar">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <form th:if="${v.estado == 'Activo'}" th:action="@{'/ventas/eliminar/' + ${v.idVenta}}" method="post" class="d-inline">
                            <button type="submit" class="btn-ff-icon eliminar" title="Inactivar">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </form>
                        <form th:if="${v.estado != 'Activo'}" th:action="@{'/ventas/reactivar/' + ${v.idVenta}}" method="post" class="d-inline">
                            <button type="submit" class="btn-ff-icon reactivar" title="Reactivar">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr id="filaSinResultados" class="ff-filtros-vacio">
                    <td colspan="9" class="text-center text-muted py-4">Ninguna venta coincide con la busqueda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="none">
    (function () {
        const tabla = document.getElementById('tablaVentas');
        if (!tabla) return;

        const filas = Array.from(tabla.querySelectorAll('tbody tr'))
            .filter(fila => fila.hasAttribute('data-search'));
        const filaSinResultados = document.getElementById('filaSinResultados');

        const inputTexto = document.getElementById('filtroTexto');
        const selectMetodo = document.getElementById('filtroMetodo');
        const selectEstado = document.getElementById('filtroEstado');
        const inputDesde = document.getElementById('filtroDesde');
        const inputHasta = document.getElementById('filtroHasta');
        const btnLimpiar = document.getElementById('btnLimpiarFiltros');
        const btnToggleFiltros = document.getElementById('btnToggleFiltros');
        const panelFiltros = document.getElementById('panelFiltros');

        btnToggleFiltros.addEventListener('click', () => {
            panelFiltros.classList.toggle('d-none');
            const abierto = !panelFiltros.classList.contains('d-none');
            btnToggleFiltros.setAttribute('aria-expanded', String(abierto));
            btnToggleFiltros.classList.toggle('active', abierto);
        });

        const metodos = new Set(filas.map(f => f.getAttribute('data-metodo')).filter(Boolean));
        Array.from(metodos).sort().forEach(valor => {
            const opcion = document.createElement('option');
            opcion.value = valor;
            opcion.textContent = valor;
            selectMetodo.appendChild(opcion);
        });

        function aplicarFiltros() {
            const texto = inputTexto.value.trim().toLowerCase();
            const metodo = selectMetodo.value;
            const estado = selectEstado.value;
            const desde = inputDesde.value;
            const hasta = inputHasta.value;
            let visibles = 0;

            filas.forEach(fila => {
                const fecha = fila.getAttribute('data-fecha');
                const coincideTexto = !texto || fila.getAttribute('data-search').includes(texto);
                const coincideMetodo = !metodo || fila.getAttribute('data-metodo') === metodo;
                const coincideEstado = !estado || fila.getAttribute('data-estado') === estado;
                const coincideDesde = !desde || fecha >= desde;
                const coincideHasta = !hasta || fecha <= hasta;
                const mostrar = coincideTexto && coincideMetodo && coincideEstado && coincideDesde && coincideHasta;

                fila.classList.toggle('d-none', !mostrar);
                if (mostrar) visibles++;
            });

            filaSinResultados.classList.toggle('ff-filtros-vacio', visibles !== 0);
        }

        [inputTexto, selectMetodo, selectEstado, inputDesde, inputHasta].forEach(el => {
            el.addEventListener('input', aplicarFiltros);
            el.addEventListener('change', aplicarFiltros);
        });

        btnLimpiar.addEventListener('click', () => {
            inputTexto.value = '';
            selectMetodo.value = '';
            selectEstado.value = '';
            inputDesde.value = '';
            inputHasta.value = '';
            aplicarFiltros();
        });
    })();

    // Mostrar toast de éxito por 4 segundos
    (function () {
        const toastElement = document.getElementById('toastExito');
        if (toastElement) {
            toastElement.style.display = 'block';
            setTimeout(function () {
                toastElement.style.display = 'none';
            }, 4000);
        }
    })();
</script>
</body>
</html>
