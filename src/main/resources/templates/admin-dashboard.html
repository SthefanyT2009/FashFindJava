<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Administracion - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='inicio')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3">
        <h5 class="mb-0 fw-bold">
            Bienvenido, <span th:text="${usuarioActual != null} ? ${usuarioActual.nombres} : 'Administrador'">Administrador</span>
        </h5>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light btn-sm fw-semibold" style="color: var(--ff-rosa);">Salir</button>
        </form>
    </div>

    <div class="container-fluid p-4">
        <div class="row g-3">
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Usuarios Activos</p>
                    <p class="fs-3 fw-bold mb-0 text-ff">16</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Usuarios Inactivos</p>
                    <p class="fs-3 fw-bold mb-0 text-ff">0</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Ventas Quincenales</p>
                    <p class="fs-3 fw-bold mb-0 text-ff">$1.915.000</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Pedidos Por Entregar</p>
                    <p class="fs-3 fw-bold mb-0 text-ff">8</p>
                </div>
            </div>
        </div>

        <div class="alert alert-light border mt-4">
            <i class="bi bi-info-circle me-1"></i>
            Usuarios, Ventas y Pedidos se conectan en la siguiente etapa. Productos e Inventario ya estan en el menu lateral.
        </div>
    </div>
</div>

</body>
</html>
