<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Administracion - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='inicio')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3">
        <h5 class="mb-0 fw-bold">
            Bienvenido Administrador/a, <span th:text="${usuarioActual != null} ? ${usuarioActual.nombres} : 'Administrador'">Administrador</span>
        </h5>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light btn-sm fw-semibold" style="color: var(--ff-rosa);">Salir</button>
        </form>
    </div>

    <div class="container-fluid p-4">
        <div class="row g-3">
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Usuarios Activos</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${usuariosActivos}">0</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Usuarios Inactivos</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${usuariosInactivos}">0</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Clientes Registrados</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${clientesRegistrados}">0</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Clientes Inactivos</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${clientesInactivos}">0</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Ventas Quincenales</p>
                    <p class="fs-3 fw-bold mb-0 text-ff"
                       th:text="'$' + ${#numbers.formatInteger(ventasQuincenales, 1, 'POINT')}">$0</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Productos Activos</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${productosActivos}">0</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Productos Inactivos</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${productosInactivos}">0</p>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body">
                <p class="fw-semibold mb-3" style="color:#1a1a2e;">Ventas &mdash; Ultimos 15 dias</p>
                <canvas id="graficoVentasQuincenales" height="90"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const etiquetasVentas = /*[[${ventasEtiquetas}]]*/ [];
    const valoresVentas = /*[[${ventasValores}]]*/ [];
    /*]]>*/

    const ctx = document.getElementById('graficoVentasQuincenales');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: etiquetasVentas,
            datasets: [{
                label: 'Ventas ($)',
                data: valoresVentas,
                borderColor: '#e91e8c',
                backgroundColor: 'rgba(233, 30, 140, 0.12)',
                fill: true,
                tension: 0.3,
                pointBackgroundColor: '#e91e8c',
                pointRadius: 3
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: (item) => '$' + item.parsed.y.toLocaleString('es-CO')
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: (valor) => '$' + Number(valor).toLocaleString('es-CO')
                    }
                }
            }
        }
    });
</script>

</body>
</html>
