<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Venta #' + ${venta.idVenta} + ' - FashFind'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
    <style>
        @media print {
            .ff-sidebar, .ff-topbar, .no-print { display: none !important; }
            .ff-content { margin-left: 0 !important; }
        }
        .ff-recibo { border: 1px dashed #f0dbe9; border-radius: 14px; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='ventas')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3 no-print">
        <h5 class="mb-0 fw-bold" th:text="'Venta #' + ${venta.idVenta}"></h5>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-ff-light btn-sm" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>Imprimir
            </button>
            <a th:if="${venta.estado == 'Activo'}" th:href="@{'/ventas/editar/' + ${venta.idVenta}}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-pencil-fill me-1"></i>Actualizar
            </a>
            <a th:href="@{/ventas}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="container-fluid p-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 ff-card-table p-4 p-md-5">

                    <div class="d-flex justify-content-between align-items-start flex-wrap mb-4">
                        <div>
                            <h4 class="fw-bold mb-0"><i class="bi bi-bag-heart-fill text-ff me-2"></i>FashFind</h4>
                            <p class="text-muted small mb-0">Comprobante de venta de mostrador</p>
                        </div>
                        <span class="badge-stock" th:classappend="${venta.estado == 'Activo'} ? 'badge-stock-normal' : 'badge-stock-bajo'"
                              th:text="${venta.estado}"></span>
                    </div>

                    <div class="row mb-4">
                        <div class="col-6 col-md-3 mb-2">
                            <p class="text-muted small mb-0">Venta</p>
                            <p class="fw-semibold mb-0" th:text="'#' + ${venta.idVenta}"></p>
                        </div>
                        <div class="col-6 col-md-3 mb-2">
                            <p class="text-muted small mb-0">Fecha</p>
                            <p class="fw-semibold mb-0" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy')}"></p>
                        </div>
                        <div class="col-6 col-md-3 mb-2">
                            <p class="text-muted small mb-0">Hora</p>
                            <p class="fw-semibold mb-0" th:text="${#temporals.format(venta.hora, 'HH:mm')}"></p>
                        </div>
                        <div class="col-6 col-md-3 mb-2">
                            <p class="text-muted small mb-0">Metodo de Pago</p>
                            <p class="fw-semibold mb-0" th:text="${venta.metodoPago}"></p>
                        </div>
                        <div class="col-12 col-md-6 mb-2">
                            <p class="text-muted small mb-0">Vendedor</p>
                            <p class="fw-semibold mb-0" th:text="${venta.usuario.nombres} + ' ' + ${venta.usuario.apellidos}"></p>
                        </div>
                    </div>

                    <div class="ff-recibo p-0 mb-4">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Talla</th>
                                <th>Color</th>
                                <th class="text-center">Cantidad</th>
                                <th class="text-end">Precio</th>
                                <th class="text-end">Subtotal</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="d : ${venta.detalles}">
                                <td class="fw-semibold" th:text="${d.producto.nombreProducto}"></td>
                                <td th:text="${d.producto.talla}"></td>
                                <td th:text="${d.producto.color}"></td>
                                <td class="text-center" th:text="${d.cantidad}"></td>
                                <td class="text-end" th:text="'$' + ${#numbers.formatInteger(d.precio, 1, 'POINT')}"></td>
                                <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatInteger(d.subTotal, 1, 'POINT')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="row justify-content-end">
                        <div class="col-md-5">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Total</span>
                                <span class="fw-bold fs-5 text-ff" th:text="'$' + ${#numbers.formatInteger(venta.costoTotal, 1, 'POINT')}"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Pago Recibido</span>
                                <span class="fw-semibold" th:text="'$' + ${#numbers.formatInteger(venta.pagoRecibido, 1, 'POINT')}"></span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Cambio</span>
                                <span class="fw-semibold" style="color:#1a7a3a;" th:text="'$' + ${#numbers.formatInteger(venta.cambio, 1, 'POINT')}"></span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
