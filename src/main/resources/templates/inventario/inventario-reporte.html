<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Reporte de Inventario - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
    <style>
        @media print {
            .ff-sidebar, .ff-topbar, .no-print { display: none !important; }
            .ff-content { margin-left: 0 !important; }
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='inventario')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3 no-print">
        <h5 class="mb-0 fw-bold">Reporte de Inventario</h5>
        <div class="d-flex gap-2">
            <a th:href="@{/inventario/reporte/pdf}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-file-earmark-pdf me-1"></i>Descargar PDF
            </a>
            <a th:href="@{/inventario/reporte/excel}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-file-earmark-excel me-1"></i>Descargar Excel
            </a>
            <button type="button" class="btn btn-ff-light btn-sm" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>Imprimir
            </button>
            <a th:href="@{/inventario}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="container-fluid p-4">

        <div class="mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-bag-heart-fill text-ff me-2"></i>FashFind</h4>
            <p class="text-muted small mb-0">
                Reporte generado el <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
                <span th:if="${usuarioActual != null}"> por <span th:text="${usuarioActual.nombres}"></span></span>
            </p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Referencias</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${totalReferencias}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Unidades totales</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${unidadesTotales}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3" style="border-top-color:#b3261e;">
                    <p class="text-muted small mb-1">Bajo Stock</p>
                    <p class="fs-3 fw-bold mb-0" style="color:#b3261e;" th:text="${bajoStock}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3" style="border-top-color:#1a7a3a;">
                    <p class="text-muted small mb-1">Normal</p>
                    <p class="fs-3 fw-bold mb-0" style="color:#1a7a3a;" th:text="${normal}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3" style="border-top-color:#5b3aa8;">
                    <p class="text-muted small mb-1">Sobrestock</p>
                    <p class="fs-3 fw-bold mb-0" style="color:#5b3aa8;" th:text="${sobrestock}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Valor en inventario</p>
                    <p class="fs-5 fw-bold mb-0 text-ff" th:text="'$' + ${#numbers.formatInteger(valorTotal, 1, 'POINT')}"></p>
                </div>
            </div>
        </div>

        <div class="ff-card-table">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Talla</th>
                    <th>Color</th>
                    <th>Precio</th>
                    <th>Stock Disponible</th>
                    <th>Stock Minimo</th>
                    <th>Nivel</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(inventarios)}">
                    <td colspan="8" class="text-center text-muted py-4">No hay inventario registrado.</td>
                </tr>
                <tr th:each="inv : ${inventarios}">
                    <td th:text="${inv.producto.nombreProducto}" class="fw-semibold"></td>
                    <td th:text="${inv.producto.talla}"></td>
                    <td th:text="${inv.producto.color}"></td>
                    <td th:text="'$' + ${inv.producto.precio}"></td>
                    <td th:text="${inv.stockDisponible}"></td>
                    <td th:text="${inv.stockMinimo}"></td>
                    <td>
                        <span class="badge-stock"
                              th:classappend="${inv.nivelStock == 'Bajo Stock'} ? 'badge-stock-bajo' : (${inv.nivelStock == 'Sobrestock'} ? 'badge-stock-sobre' : 'badge-stock-normal')"
                              th:text="${inv.nivelStock}"></span>
                    </td>
                    <td>
                        <span class="badge-stock" th:classappend="${inv.estado == 'Activo'} ? 'badge-stock-normal' : 'badge-stock-bajo'"
                              th:text="${inv.estado}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
