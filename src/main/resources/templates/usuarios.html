<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Usuarios - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='usuarios')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3">
        <h5 class="mb-0 fw-bold">
            Gestion de Usuarios - <span th:text="${usuarioActual != null} ? ${usuarioActual.nombres} : ''"></span>
        </h5>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-ff-light btn-sm">
            <i class="bi bi-person-plus me-1"></i>Nuevo Usuario
        </a>
    </div>

    <div class="container-fluid p-4">

        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        
        <!-- Toast de éxito -->
        <div id="toastExito" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11; display:none;" th:if="${exito}">
            <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body d-flex align-items-center bg-success text-white rounded">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span id="textoToast" th:text="${exito}"></span>
                </div>
            </div>
        </div>

        <div class="ff-filtros">
            <div class="d-flex gap-2">
                <input type="text" id="filtroTexto" class="form-control" placeholder="Buscar en usuarios (nombre, usuario, cedula, genero, direccion, correo, telefono, cargo, estado)...">
                <button type="button" id="btnToggleFiltros" class="btn btn-outline-secondary text-nowrap" aria-expanded="false" aria-controls="panelFiltros">
                    <i class="bi bi-funnel me-1"></i>Filtros
                </button>
            </div>
            <div id="panelFiltros" class="row g-2 align-items-center mt-3 d-none">
                <div class="col-6 col-md-4">
                    <select id="filtroCargo" class="form-select">
                        <option value="">Cargo (todos)</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Vendedor">Vendedor</option>
                        <option value="Domiciliario">Domiciliario</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                </div>
                <div class="col-6 col-md-4">
                    <select id="filtroEstado" class="form-select">
                        <option value="">Estado (todos)</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
                <div class="col-6 col-md-4">
                    <button type="button" id="btnLimpiarFiltros" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-circle me-1"></i>Limpiar
                    </button>
                </div>
            </div>
        </div>

        <div class="ff-card-table">
            <table class="table table-hover align-middle mb-0" id="tablaUsuarios">
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Nombre completo</th>
                    <th>Cedula</th>
                    <th>Genero</th>
                    <th>Direccion</th>
                    <th>Fecha Registro</th>
                    <th>Correo</th>
                    <th>Telefono</th>
                    <th>Cargo</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="11" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                </tr>
                <tr th:each="u : ${usuarios}"
                    th:attr="data-search=${#strings.toLowerCase(u.nombreUsuario + ' ' + u.nombres + ' ' + u.apellidos + ' ' + u.cc + ' ' + u.correo + ' ' + u.telefono + ' ' + u.cargo + ' ' + u.estado + ' ' + (u.genero != null ? u.genero : '') + ' ' + (u.direccion != null ? u.direccion : ''))},
                             data-cargo=${u.cargo},
                             data-estado=${u.estado}">
                    <td th:text="${u.nombreUsuario}" class="fw-semibold"></td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td th:text="${u.cc}"></td>
                    <td th:text="${u.genero}"></td>
                    <td th:text="${u.direccion}"></td>
                    <td th:text="${#temporals.format(u.fechaRegistro, 'dd/MM/yyyy')}"></td>
                    <td th:text="${u.correo}"></td>
                    <td th:text="${u.telefono}"></td>
                    <td>
                        <span class="badge-stock badge-stock-sobre" th:text="${u.cargo}"></span>
                    </td>
                    <td>
                        <span class="badge-stock" th:classappend="${u.estado == 'Activo'} ? 'badge-stock-normal' : 'badge-stock-bajo'"
                              th:text="${u.estado}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/usuarios/editar/' + ${u.idUsuario}}" class="btn-ff-icon editar" title="Actualizar">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <form th:if="${u.estado == 'Activo'}" th:action="@{'/usuarios/eliminar/' + ${u.idUsuario}}" method="post" class="d-inline">
                            <button type="submit" class="btn-ff-icon eliminar" title="Desactivar">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </form>
                        <form th:if="${u.estado != 'Activo'}" th:action="@{'/usuarios/reactivar/' + ${u.idUsuario}}" method="post" class="d-inline">
                            <button type="submit" class="btn-ff-icon reactivar" title="Reactivar">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr id="filaSinResultados" class="ff-filtros-vacio">
                    <td colspan="11" class="text-center text-muted py-4">Ningun usuario coincide con la busqueda.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:inline="none">
    // Mostrar toast de éxito por 4 segundos
    (function () {
        const toastElement = document.getElementById('toastExito');
        if (toastElement) {
            toastElement.style.display = 'block';
            setTimeout(function () {
                toastElement.style.display = 'none';
            }, 4000);
        }
    })();
    
    (function () {
        const tabla = document.getElementById('tablaUsuarios');
        if (!tabla) return;

        const filas = Array.from(tabla.querySelectorAll('tbody tr'))
            .filter(fila => fila.hasAttribute('data-search'));
        const filaSinResultados = document.getElementById('filaSinResultados');

        const inputTexto = document.getElementById('filtroTexto');
        const selectCargo = document.getElementById('filtroCargo');
        const selectEstado = document.getElementById('filtroEstado');
        const btnLimpiar = document.getElementById('btnLimpiarFiltros');
        const btnToggleFiltros = document.getElementById('btnToggleFiltros');
        const panelFiltros = document.getElementById('panelFiltros');

        btnToggleFiltros.addEventListener('click', () => {
            panelFiltros.classList.toggle('d-none');
            const abierto = !panelFiltros.classList.contains('d-none');
            btnToggleFiltros.setAttribute('aria-expanded', String(abierto));
            btnToggleFiltros.classList.toggle('active', abierto);
        });

        function aplicarFiltros() {
            const texto = inputTexto.value.trim().toLowerCase();
            const cargo = selectCargo.value;
            const estado = selectEstado.value;
            let visibles = 0;

            filas.forEach(fila => {
                const coincideTexto = !texto || fila.getAttribute('data-search').includes(texto);
                const coincideCargo = !cargo || fila.getAttribute('data-cargo') === cargo;
                const coincideEstado = !estado || fila.getAttribute('data-estado') === estado;
                const mostrar = coincideTexto && coincideCargo && coincideEstado;

                fila.classList.toggle('d-none', !mostrar);
                if (mostrar) visibles++;
            });

            filaSinResultados.classList.toggle('ff-filtros-vacio', visibles !== 0);
        }

        [inputTexto, selectCargo, selectEstado].forEach(el => {
            el.addEventListener('input', aplicarFiltros);
            el.addEventListener('change', aplicarFiltros);
        });

        btnLimpiar.addEventListener('click', () => {
            inputTexto.value = '';
            selectCargo.value = '';
            selectEstado.value = '';
            aplicarFiltros();
        });
    })();
</script>

</body>
</html>
