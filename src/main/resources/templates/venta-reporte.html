<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Reporte de Ventas - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
    <style>
        @media print {
            .ff-sidebar, .ff-topbar, .no-print { display: none !important; }
            .ff-content { margin-left: 0 !important; }
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='ventas')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3 no-print">
        <h5 class="mb-0 fw-bold">Reporte de Ventas</h5>
        <div class="d-flex gap-2">
            <a th:href="@{/ventas/reporte/pdf}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-file-earmark-pdf me-1"></i>Descargar PDF
            </a>
            <a th:href="@{/ventas/reporte/excel}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-file-earmark-excel me-1"></i>Descargar Excel
            </a>
            <button type="button" class="btn btn-ff-light btn-sm" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>Imprimir
            </button>
            <a th:href="@{/ventas}" class="btn btn-ff-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="container-fluid p-4">

        <div class="mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-bag-heart-fill text-ff me-2"></i>FashFind</h4>
            <p class="text-muted small mb-0">
                Reporte generado el <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
                <span th:if="${usuarioActual != null}"> por <span th:text="${usuarioActual.nombres}"></span></span>
            </p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Ventas</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${totalVentas}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Unidades vendidas</p>
                    <p class="fs-3 fw-bold mb-0 text-ff" th:text="${unidadesVendidas}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3" style="border-top-color:#1a7a3a;">
                    <p class="text-muted small mb-1">Efectivo</p>
                    <p class="fs-3 fw-bold mb-0" style="color:#1a7a3a;" th:text="${ventasEfectivo}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3" style="border-top-color:#5b3aa8;">
                    <p class="text-muted small mb-1">Transferencia</p>
                    <p class="fs-3 fw-bold mb-0" style="color:#5b3aa8;" th:text="${ventasTransferencia}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Ticket promedio</p>
                    <p class="fs-5 fw-bold mb-0 text-ff" th:text="'$' + ${#numbers.formatInteger(ticketPromedio, 1, 'POINT')}"></p>
                </div>
            </div>
            <div class="col-6 col-lg-2">
                <div class="card ff-stat-card shadow-sm border-0 text-center p-3">
                    <p class="text-muted small mb-1">Ingresos totales</p>
                    <p class="fs-5 fw-bold mb-0 text-ff" th:text="'$' + ${#numbers.formatInteger(ingresosTotales, 1, 'POINT')}"></p>
                </div>
            </div>
        </div>

        <div class="ff-card-table">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Vendedor</th>
                    <th>Metodo de Pago</th>
                    <th class="text-center">Unidades</th>
                    <th>Total</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(ventas)}">
                    <td colspan="8" class="text-center text-muted py-4">No hay ventas registradas.</td>
                </tr>
                <tr th:each="v : ${ventas}">
                    <td class="fw-semibold text-ff" th:text="'#' + ${v.idVenta}"></td>
                    <td th:text="${#temporals.format(v.fechaVenta, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(v.hora, 'HH:mm')}"></td>
                    <td th:text="${v.usuario.nombres} + ' ' + ${v.usuario.apellidos}"></td>
                    <td th:text="${v.metodoPago}"></td>
                    <td class="text-center" th:text="${v.totalUnidades}"></td>
                    <td class="fw-semibold" th:text="'$' + ${#numbers.formatInteger(v.costoTotal, 1, 'POINT')}"></td>
                    <td>
                        <span class="badge-stock" th:classappend="${v.estado == 'Activo'} ? 'badge-stock-normal' : 'badge-stock-bajo'"
                              th:text="${v.estado}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
