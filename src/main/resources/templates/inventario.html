<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Inventario - FashFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/fashfind.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/sidebar :: sidebar(activo='inventario')}"></div>

<div class="ff-content">
    <div class="ff-topbar d-flex justify-content-between align-items-center px-4 py-3">
        <h5 class="mb-0 fw-bold">
            Gestion de Inventario - <span th:text="${usuarioActual != null} ? ${usuarioActual.nombres} : ''"></span>
        </h5>
    </div>

    <div class="container-fluid p-4">
        <div class="ff-card-table">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Talla</th>
                    <th>Color</th>
                    <th>Precio</th>
                    <th>Stock Disponible</th>
                    <th>Stock Minimo</th>
                    <th>Nivel</th>
                    <th class="text-end">Actualizar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(inventarios)}">
                    <td colspan="8" class="text-center text-muted py-4">No hay inventario registrado.</td>
                </tr>
                <tr th:each="inv : ${inventarios}">
                    <td th:text="${inv.producto.nombreProducto}" class="fw-semibold"></td>
                    <td th:text="${inv.producto.talla}"></td>
                    <td th:text="${inv.producto.color}"></td>
                    <td th:text="'$' + ${inv.producto.precio}"></td>
                    <td th:text="${inv.stockDisponible}"></td>
                    <td th:text="${inv.stockMinimo}"></td>
                    <td>
                        <span class="badge-stock"
                              th:classappend="${inv.nivelStock == 'Bajo Stock'} ? 'badge-stock-bajo' : (${inv.nivelStock == 'Sobrestock'} ? 'badge-stock-sobre' : 'badge-stock-normal')"
                              th:text="${inv.nivelStock}"></span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{'/inventario/actualizar/' + ${inv.idInventario}}" method="post" class="d-flex gap-1 justify-content-end">
                            <input type="number" name="stockDisponible" th:value="${inv.stockDisponible}" class="form-control form-control-sm" style="width:75px" min="0">
                            <input type="number" name="stockMinimo" th:value="${inv.stockMinimo}" class="form-control form-control-sm" style="width:75px" min="0">
                            <button type="submit" class="btn-ff-icon editar" title="Guardar">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
